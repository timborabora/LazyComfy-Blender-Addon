schema_version = "1.1.0"

id = "lazy_comfy"
version = "1.1.0"
name = "Lazy Comfy"
tagline = "ComfyUI for Blender"
maintainer = "Tim Jagodka"
type = "add-on"
website = "https://github.com/timborabora/LazyComfy-Blender-Addon"

tags = ["Render"]

blender_version_min = "5.0.0"

license = ["SPDX:MIT"]

[permissions]
network = "Connect to the local ComfyUI server"
files = "Save render passes and results, read workflows"

[build]
paths_exclude_pattern = ["__pycache__/", "*.pyc"]
