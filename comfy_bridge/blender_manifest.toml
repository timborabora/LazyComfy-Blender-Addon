schema_version = "1.0.0"

id = "comfy_bridge"
version = "0.4.1"
name = "Comfy Bridge"
tagline = "Send Blender renders and render passes to ComfyUI"
maintainer = "Tim Jagodka"
type = "add-on"
website = "https://github.com/timborabora/comfy_bridge"

tags = ["Render"]

blender_version_min = "5.0.0"

license = ["SPDX:MIT"]

[permissions]
network = "Connect to the local ComfyUI server"
files = "Save render passes and results, read workflows"

[build]
paths_exclude_pattern = ["__pycache__/", "*.pyc"]
